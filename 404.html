      <article>
        <h1>brightcap — Cambridge Property Co-Investment</h1>
        <p>Investing in real estate for the AI era. brightcap acquires residential blocks in Cambridge in selective partnership with sophisticated co-investors.</p>

        <h2>We believe AI will reshape where property wealth is created.</h2>
        <p>AI is accelerating the growth of a small number of cities—and leaving others behind. This isn't a cycle. It's a structural shift. Our thesis is that the cities at its centre will attract a growing share of talent, capital and opportunity for decades—strengthening long-term rental demand and property values. Since our launch, JLL has published research showing that this divergence is already underway.</p>

        <h2>Why Cambridge</h2>
        <p>Our first market. A world-leading science and technology cluster. No.1 Science & Tech: most innovation-intensive cluster in Europe — No.2 globally (WIPO 2025). No.1 UK university for world-class talent. 5,300+ science & tech firms including Google, Apple, ARM, AstraZeneca. 100% capital growth over the last 20 years. 5× the UK's average employment growth.</p>

        <h2>What We Acquire</h2>
        <p>We buy residential blocks in Cambridge and turn them into high quality homes — with our partner investors. Step 1: Acquire undervalued blocks — typically 2 to 20 units. Step 2: Create 15–25% equity uplift — through title splitting and high-spec renovation of each unit. Step 3: Generate long-term hands-off income — let to professional tenants or supported living providers.</p>

        <h2>Our Construction Team</h2>
        <p>Our renovations are delivered by our founder's family-run construction and maintenance business — building in Cambridge for over 25 years. They build to last and the same team maintains it — so standards stay high and issues get resolved fast. Project examples include kitchen renovations, church conversions, living room refurbishments, and extensions.</p>

        <h2>Who Invests With Us</h2>
        <p>Our partner investors are exited founders and business owners with capital to put to work, who want long-term exposure to Cambridge without building their own property team. Exited founders — who've sold or taken significant cash out of a business. Business owners — generating strong profits and looking to grow outside their core industry. Typical investment amounts range from £250k to £3m+.</p>

        <h2>The Founders</h2>
        <p>BrightCap is led by entrepreneurs with a track record of building businesses and delivering property projects for private investors.</p>
        <p>Andy Fidler — Decades of experience building and scaling businesses. £6.2M property portfolio. Featured in BBC, The Telegraph, and multiple property industry publications. Winner of 20+ UK and Global property and business awards.</p>
        <p>Sam Carter — Co-founder with combined 34 years of experience across property and business.</p>
        <p>Alongside BrightCap, our founders also own MarketOffer, a nationwide social housing leasing platform, while Sam's family construction and maintenance business has been delivering projects in Cambridge for over 25 years.</p>
        <p>BrightCap is a trading name of RM Incorporations Ltd, a private limited company registered in England and Wales under company number 16715037. Registered office: 16 Pettitts Lane, Dry Drayton, Cambridge, England, CB23 8BT.</p>

        <p>brightcap is built on a simple conviction: the right location, the right thesis, and the right local partnerships matter more than financial engineering.</p>

        <h2>Investor Testimonial</h2>
        <p>"I was looking to grow my wealth through property investment but didn't have the expertise or time to handle it myself. Sam and his team made the entire process seamless, managing everything from start to finish. Their professionalism and expertise have exceeded my expectations – an effortless investment experience with a great return!" — Mr. Tomlinson, Business Owner</p>

        <h2>Featured In</h2>
        <p>BBC, The Telegraph, Landlord Today, Landlord Zone, NRLA, Property Notify, Property Entrepreneur, Property Investor Awards.</p>

        <h2>Contact</h2>
        <p>Interested in BrightCap's Cambridge strategy? Learn how we acquire and improve residential blocks in Cambridge—and how investors can work with us. Book a call with our investment team — a no-obligation introductory call to learn about BrightCap, our Cambridge residential-block strategy and how we work with investors.</p>
        <p>Email: support@brightcap.capital. Telephone: 0800 086 2278.</p>
